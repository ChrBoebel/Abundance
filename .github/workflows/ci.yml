name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: abundance_test
          POSTGRES_USER: abundance
          POSTGRES_PASSWORD: abundance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abundance -d abundance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://abundance:abundance_test@localhost:5432/abundance_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83" wheel
          python -m pip install -e ".[dev]"

      - name: Lint Python sources
        run: python -m ruff check backend_server.py src tests

      - name: Compile Python sources
        run: python -m compileall backend_server.py src

      - name: Typecheck Python sources
        run: python -m mypy src backend_server.py

      - name: Run backend tests
        run: python -m pytest -q

      - name: Validate research evaluation dataset
        run: |
          python -m abundance_research.eval_harness --dataset evals/reference-cases.json --validate-only
          python -m abundance_research.assessment_eval_harness --dataset evals/evidence-assessment-cases.json --validate-only
          python -m abundance_research.claim_verification_eval_harness --dataset evals/claim-verification-cases.json --validate-only

      - name: Audit Python dependencies
        run: python -m pip_audit
