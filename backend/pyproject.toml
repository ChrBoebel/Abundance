[project]
name = "abundance-research"
version = "1.0.0"
description = "Evidence-oriented research orchestration for Abundance."
authors = [
    { name = "Christopher Bobel" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "langchain-core>=0.3.72",
    "langchain-openai>=0.3.28",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.1",
]

[project.urls]
Homepage = "https://github.com/ChrBoebel/Abundance"
Repository = "https://github.com/ChrBoebel/Abundance"
Issues = "https://github.com/ChrBoebel/Abundance/issues"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abundance_research*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"backend_server.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"
