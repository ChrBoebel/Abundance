[project]
name = "abundance-research"
version = "1.0.0"
description = "Evidence-oriented research orchestration for Abundance."
authors = [
    { name = "Christopher Bobel" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.10.0",
    "langchain>=0.3.27",
    "langchain-core>=0.3.72",
    "langgraph>=0.5.4",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-tavily",
    "tavily-python>=0.5.0",
    "arxiv>=2.1.3",
    "pymupdf>=1.25.3",
    "xmltodict>=0.14.2",
    "requests>=2.32.3",
    "beautifulsoup4==4.13.3",
    "httpx>=0.24.0",
    "markdownify>=0.11.6",
    "rich>=13.0.0",
    "langsmith>=0.3.37",
    "langchain-google-genai>=2.1.5",
    "mcp>=1.9.4",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.1"]

[project.urls]
Homepage = "https://github.com/ChrBoebel/Abundance"
Repository = "https://github.com/ChrBoebel/Abundance"
Issues = "https://github.com/ChrBoebel/Abundance/issues"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abundance_research*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
